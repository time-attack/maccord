<svg width="1560" height="640" viewBox="0 0 1560 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B68FF"/>
      <stop offset="1" stop-color="#4750D6"/>
    </linearGradient>
    <linearGradient id="tileDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252B"/>
      <stop offset="1" stop-color="#16171B"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1560" height="640" fill="#0E0F13"/>

  <!-- Option A: bold ⌘ -->
  <g transform="translate(80,70)">
    <g filter="url(#sh)"><rect width="440" height="440" rx="104" fill="url(#tile)"/></g>
    <text x="220" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="300" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">&#8984;</text>
    <text x="220" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#C9CEF5" text-anchor="middle">A — Command</text>
  </g>

  <!-- Option B: M monogram -->
  <g transform="translate(560,70)">
    <g filter="url(#sh)"><rect width="440" height="440" rx="104" fill="url(#tile)"/></g>
    <text x="220" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="340" font-weight="800" letter-spacing="-6" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">M</text>
    <text x="220" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#C9CEF5" text-anchor="middle">B — Monogram</text>
  </g>

  <!-- Option C: dark tile + blurple ⌘ (sleek) -->
  <g transform="translate(1040,70)">
    <g filter="url(#sh)"><rect width="440" height="440" rx="104" fill="url(#tileDark)" stroke="#5865F2" stroke-opacity="0.35" stroke-width="2"/></g>
    <text x="220" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="300" font-weight="700" fill="#5865F2" text-anchor="middle" dominant-baseline="central">&#8984;</text>
    <text x="220" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#C9CEF5" text-anchor="middle">C — Midnight</text>
  </g>
</svg>
